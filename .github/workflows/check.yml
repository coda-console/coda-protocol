name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Stable surface grows from the PR target
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          node scripts/stable-grows.mjs FETCH_HEAD
      - run: npm ci
      - run: npm test
      - name: Inspect the npm archive
        run: node scripts/publish-npm.mjs --dry-run
